name: Build Blockmango Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # sdkmanager (cmdline-tools) needs a modern JDK
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Explicit packages override setup-android's broken default ("tools")
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-27 build-tools;27.0.3

      - name: Install Android NDK r16b
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ndk-r16b.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/android-ndk-r16b-windows-x86_64.zip" -OutFile $zip
          7z x $zip "-o$env:RUNNER_TEMP" -y | Out-Null
          $ndk = Join-Path $env:RUNNER_TEMP "android-ndk-r16b"

          if (-not (Test-Path (Join-Path $ndk "ndk-build.cmd"))) {
            throw "NDK r15c was not installed."
          }

          "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_NDK_ROOT=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NDK_ROOT=$ndk"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ndk                    | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Switch to JDK 8 for the actual Gradle build
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build native libraries
        shell: cmd
        run: call dev\client\Shells\Android\buildAndroid.bat

      - name: Build release APK
        shell: cmd
        working-directory: dev\client\Shells\Android\Blockmango
        run: call gradlew.bat assembleRelease --no-daemon --max-workers=8

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: blockmango-v0.2.16-build-16
          path: dev/client/Shells/Android/Blockmango/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
